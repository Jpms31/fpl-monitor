name: Update FPL monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "collect_snapshot.py"
      - "fixture_guard.py"
      - ".github/workflows/update-fpl.yml"
      - "refresh.request"

permissions:
  contents: write

concurrency:
  group: fpl-monitor-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and validate FPL data
        run: |
          set -o pipefail
          python collect_snapshot.py 2>&1 | tee /tmp/fpl-collect.log

      - name: Validate official fixture completion state
        run: |
          set -o pipefail
          python fixture_guard.py 2>&1 | tee /tmp/fpl-fixtures.log

      - name: Commit latest snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/latest.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "fpl-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update FPL league snapshot"
          git push

      - name: Publish failure diagnostics
        if: failure()
        run: |
          mkdir -p data
          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== collect_snapshot.py ==="
            cat /tmp/fpl-collect.log 2>/dev/null || true
            echo
            echo "=== fixture_guard.py ==="
            cat /tmp/fpl-fixtures.log 2>/dev/null || true
          } > data/last-run-error.log
          git config user.name "fpl-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-run-error.log
          git commit -m "Record FPL monitor failure diagnostics" || exit 0
          git push

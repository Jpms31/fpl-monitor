name: Update FPL monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "collect_snapshot.py"
      - "fixture_guard.py"
      - ".github/workflows/update-fpl.yml"
      - "refresh.request"

permissions:
  contents: write

concurrency:
  group: fpl-monitor-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and validate FPL data
        run: python collect_snapshot.py

      - name: Validate official fixture completion state
        run: python fixture_guard.py

      - name: Commit latest snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/latest.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "fpl-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update FPL league snapshot"
          git push
